# Sends the push notification jobs on a schedule. Same reasoning as ingest.yml: Vercel's
# serverless functions can't sustain the in-process background scheduler (VANTAGE_SCHEDULER=0 in
# production), so GitHub Actions does it instead.
#
# Seven triggers across four kinds, none sharing an hour so the KIND expression below can always
# tell them apart:
#   streak_reminder  04:00, 09:00, 14:00 UTC (3x/day) — but only to a reader who still hasn't
#                     opened the app that day; app/push.py drops them from the list the moment
#                     last_active_on moves to today, so this never spams someone who already came back.
#   news_alert        07:00, 15:00 UTC (2x/day) — the single best story at critical tier (score >= 70).
#   entity_updates     16:00 UTC (1x/day) — no "seen it" gate the way streak/news have, so it only fires once.
#   games_nudge        17:00 UTC (1x/day; was every 3 days).
# Each run is still gated by its own due-check in app/scheduler.py (VANTAGE_*_EVERY_HOURS /
# VANTAGE_GAMES_NUDGE_EVERY_DAYS / VANTAGE_ENTITY_UPDATES_HOUR_UTC), so a retried or manually
# re-dispatched run for the same slot never double-sends.
#
# Setup: add repository secrets DATABASE_URL (already required by ingest.yml), VAPID_PUBLIC_KEY,
# VAPID_PRIVATE_KEY and VAPID_SUBJECT (the same three values set on the Vantage API's Vercel
# project — Settings > Environment Variables there).
name: notifications

on:
  schedule:
    - cron: "0 4 * * *" # streak_reminder (1/3)
    - cron: "0 7 * * *" # news_alert (1/2)
    - cron: "0 9 * * *" # streak_reminder (2/3)
    - cron: "0 14 * * *" # streak_reminder (3/3)
    - cron: "0 15 * * *" # news_alert (2/2)
    - cron: "0 16 * * *" # entity_updates
    - cron: "0 17 * * *" # games_nudge (now daily, still internally gated)
  workflow_dispatch:
    inputs:
      kind:
        description: "streak_reminder, news_alert, entity_updates or games_nudge"
        default: "streak_reminder"

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Send the due notification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          KIND: ${{ github.event_name == 'schedule' && (contains(fromJSON('["0 4 * * *", "0 9 * * *", "0 14 * * *"]'), github.event.schedule) && 'streak_reminder' || contains(fromJSON('["0 7 * * *", "0 15 * * *"]'), github.event.schedule) && 'news_alert' || github.event.schedule == '0 16 * * *' && 'entity_updates' || 'games_nudge') || github.event.inputs.kind }}
        run: python -m app.scheduler --once "$KIND"
