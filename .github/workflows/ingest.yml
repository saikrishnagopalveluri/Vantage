# Pulls the news feeds on a schedule. A serverless host such as Vercel cannot run a background
# scheduler, so this job does it instead and writes straight to the database.
#
# Setup: add a repository secret named DATABASE_URL (your Supabase connection string).
name: ingest

on:
  schedule:
    - cron: "5 0-2,4-23 * * *" # every hour, except the hour of the daily job
    - cron: "5 3 * * *" # daily: the same pull, then old stories are cleared out
  workflow_dispatch:
    inputs:
      kind:
        description: "hourly or daily"
        default: "hourly"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull the feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KIND: ${{ github.event_name == 'schedule' && (github.event.schedule == '5 3 * * *' && 'daily' || 'hourly') || github.event.inputs.kind }}
        run: python -m app.scheduler --once "$KIND"
