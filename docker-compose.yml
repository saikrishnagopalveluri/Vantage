# Vantage on one server: the API, the web app, and Caddy for HTTPS.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#
# Only Caddy is reachable from outside. The web app and the API talk to each other on the internal network.
# Keep to one API container: SQLite, the scheduler and the login throttle all assume a single process.

services:
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # a first try works with the defaults
    volumes:
      - vantage-data:/app/data # database, session key, import cache
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  vantage-data:
  caddy-data:
  caddy-config:
